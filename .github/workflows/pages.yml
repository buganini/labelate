name: Build and deploy Labelate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: buganini/PUI
          ref: c4358175115bc2da8d1859e07ecb0e0e85ebc457
          path: .build/PUI
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev,printers]'
      - name: Install Qt headless dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pytest -q
      - run: npm ci
      - run: python scripts/build_pyodide.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: labelate-pyodide
          path: dist/pyodide
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist/pyodide

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
