[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labelate"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "A QPUIQ label template editor and Pillow renderer"
requires-python = ">=3.11"
dependencies = ["QPUIQ[pyside6]==1.10", "Pillow>=10", "qrcode>=7.4", "python-barcode>=0.15", "msgpack==1.1.2", "openpyxl==3.1.5"]

[project.optional-dependencies]
# libusb-package ships the libusb shared library pyusb needs (Windows has none).
dev = ["pytest>=8"]
brother = ['brother-ql @ git+https://github.com/pklaus/brother_ql.git@0dee94b5fc3721159bae556b8bd2d975f92b7b8b', 'libusb-package==1.0.30.1']
niim = ['pyniim @ git+https://github.com/buganini/pyniim.git@de4d2943cc42879d8a3228d9975eacb8694a7189']
tsc = ['pytsc[usb] @ git+https://github.com/buganini/pytsc.git@e828054f813aefbb8e34ba3fbef802d15c5bb74f', 'libusb-package==1.0.30.1']
printers = ['brother-ql @ git+https://github.com/pklaus/brother_ql.git@0dee94b5fc3721159bae556b8bd2d975f92b7b8b', 'pyniim @ git+https://github.com/buganini/pyniim.git@de4d2943cc42879d8a3228d9975eacb8694a7189', 'pytsc[usb] @ git+https://github.com/buganini/pytsc.git@e828054f813aefbb8e34ba3fbef802d15c5bb74f', 'libusb-package==1.0.30.1']


[project.scripts]
labelate = "labelate.app:main"

[tool.setuptools.packages.find]
include = ["labelate*"]

[tool.setuptools.dynamic]
version = {attr = "labelate.version.__version__"}

[tool.setuptools.package-data]
labelate = ["icon.svg", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
