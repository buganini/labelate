[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labelate"
version = "0.1.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "A QPUIQ label template editor and Pillow renderer"
requires-python = ">=3.10"
dependencies = ["QPUIQ[pyside6]==1.8", "Pillow>=10", "qrcode>=7.4", "python-barcode>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
labelate = "labelate.app:main"

[tool.setuptools.packages.find]
include = ["labelate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
